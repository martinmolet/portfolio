<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Martin Molet — Lead Design System & Design Ops</title>
<meta name="description" content="Product Designer spécialisé design system et design ops. 8 ans, de l'e-commerce à la banque retail.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F7F6F3;
  --surface: #FFFFFF;
  --surface-2: #FBFBFA;
  --line: #EAEAEA;
  --line-soft: rgba(0, 0, 0, 0.06);
  --ink: #111111;
  --ink-2: #2F3437;
  --muted: #787774;
  --muted-2: #A09F9B;

  --red-bg: #FDEBEC;    --red-fg: #9F2F2D;
  --blue-bg: #E1F3FE;   --blue-fg: #1F6C9F;
  --green-bg: #EDF3EC;  --green-fg: #346538;
  --yellow-bg: #FBF3DB; --yellow-fg: #956400;

  --sans: 'Geist', 'SF Pro Display', 'Helvetica Neue', sans-serif;
  --serif: 'Newsreader', 'Lyon Text', Georgia, serif;
  --mono: 'Geist Mono', 'SF Mono', 'JetBrains Mono', monospace;

  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  --wrap: 1080px;
  --gutter: 32px;
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 72px; -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink-2);
  font: 400 16px/1.6 var(--sans);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
img { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
ul, ol { margin: 0; padding: 0; list-style: none; }
h1, h2, h3, p, figure, blockquote { margin: 0; }
::selection { background: var(--yellow-bg); color: var(--ink); }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; border-radius: 4px; }

.wrap { max-width: var(--wrap); margin: 0 auto; padding: 0 var(--gutter); }

/* ── Ambient layer ─────────────────────────────── */
.ambient {
  position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden;
}
.ambient::before {
  content: ''; position: absolute;
  width: 70vmax; height: 70vmax; left: 45%; top: -25vmax;
  background: radial-gradient(closest-side, rgba(214, 190, 160, 0.22), rgba(214, 190, 160, 0));
  animation: drift 28s ease-in-out infinite alternate;
  will-change: transform;
}
@keyframes drift {
  from { transform: translate3d(0, 0, 0); }
  to   { transform: translate3d(-18vmax, 10vmax, 0); }
}

/* ── Nav ───────────────────────────────────────── */
.nav {
  position: sticky; top: 0; z-index: 10;
  background: rgba(247, 246, 243, 0.8);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  border-bottom: 1px solid transparent;
  transition: border-color 200ms ease;
}
.nav.is-scrolled { border-bottom-color: var(--line); }
.nav-in { display: flex; align-items: center; justify-content: space-between; height: 64px; gap: 24px; }
.brand { display: flex; align-items: baseline; gap: 10px; white-space: nowrap; }
.brand-name { font: 500 20px/1 var(--serif); color: var(--ink); letter-spacing: -0.02em; }
.brand-role { font: 400 12px/1 var(--mono); color: var(--muted); }
.nav-links { display: flex; gap: 4px; }
.nav-links a {
  font-size: 14px; color: var(--muted); padding: 6px 10px; border-radius: 6px;
  transition: color 200ms ease, background 200ms ease;
}
.nav-links a:hover { color: var(--ink); }
.nav-links a.is-active { color: var(--ink); background: rgba(0, 0, 0, 0.04); }
.nav-links a { white-space: nowrap; }
@media (max-width: 1200px) { .brand-role { display: none; } }

/* ── Language toggle ───────────────────────────── */
.nav-r { display: flex; align-items: center; gap: 12px; }
.lang { display: inline-flex; padding: 2px; gap: 2px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
.lang-opt {
  display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px; border-radius: 4px;
  font: 500 12px/1 var(--mono); color: var(--muted); transition: background 200ms ease, color 200ms ease;
}
.lang-opt:hover { color: var(--ink); }
.lang-opt[aria-pressed="true"] { background: var(--bg); color: var(--ink); }
.lang-opt .flag { width: 18px; height: 12px; border-radius: 2px; box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.08); flex-shrink: 0; }
.lang-opt[aria-pressed="false"] .flag { opacity: 0.55; filter: saturate(0.6); transition: opacity 200ms ease, filter 200ms ease; }
.lang-opt:hover .flag { opacity: 1; filter: none; }

/* ── Primitives ────────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; gap: 10px;
  height: 44px; padding: 0 20px; border-radius: 6px;
  font-size: 15px; font-weight: 500; white-space: nowrap;
  transition: background 200ms ease, border-color 200ms ease, transform 120ms ease;
}
.btn:active { transform: scale(0.98); }
.btn svg { width: 14px; height: 14px; }
.btn-primary { background: var(--ink); color: #FFFFFF; }
.btn-primary:hover { background: #333333; }
.btn-ghost { border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.btn-ghost:hover { border-color: #D6D5D1; }
.btn-sm { height: 36px; padding: 0 14px; font-size: 14px; }

.tag {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px; border-radius: 9999px;
  font: 500 11px/1.2 var(--sans); letter-spacing: 0.05em; text-transform: uppercase;
}
.tag-green  { background: var(--green-bg);  color: var(--green-fg); }
.tag-blue   { background: var(--blue-bg);   color: var(--blue-fg); }
.tag-red    { background: var(--red-bg);    color: var(--red-fg); }
.tag-yellow { background: var(--yellow-bg); color: var(--yellow-fg); }
.tag-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.tag-green .tag-dot { animation: pulse 2.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.35; } }

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  transition: box-shadow 200ms ease;
}
.card:hover { box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04); }

.eyebrow { font: 400 12px/1 var(--mono); color: var(--muted); letter-spacing: 0.02em; }

/* ── Sections ──────────────────────────────────── */
.section { padding: 128px 0; }
.section + .section { border-top: 1px solid var(--line); }
.sh { display: grid; grid-template-columns: 200px 1fr; gap: 32px; margin-bottom: 64px; }
.sh-title {
  font: 400 clamp(36px, 4.6vw, 56px)/1.08 var(--serif);
  letter-spacing: -0.03em; color: var(--ink);
}
.sh-title span { display: block; }
.sh-sub { margin-top: 20px; max-width: 560px; color: var(--muted); font-size: 17px; }

/* ── Hero ──────────────────────────────────────── */
.hero { position: relative; padding: 96px 0 112px; }
.hero::before {
  content: ''; position: absolute; inset: 0; z-index: -1; pointer-events: none;
  background-image:
    linear-gradient(var(--line-soft) 1px, transparent 1px),
    linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);
  background-size: 64px 64px;
  -webkit-mask-image: radial-gradient(ellipse 70% 60% at 30% 40%, #000 20%, transparent 75%);
          mask-image: radial-gradient(ellipse 70% 60% at 30% 40%, #000 20%, transparent 75%);
}
.hero-grid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); column-gap: 64px; align-items: start; }
.hero-title {
  font: 400 clamp(40px, 5.8vw, 80px)/1.02 var(--serif);
  letter-spacing: -0.035em; color: var(--ink);
  margin: 28px 0 32px;
}
.hero-title span { display: block; }
.hero-title em { font-style: italic; color: var(--muted); }
.hero-sub { font-size: 19px; max-width: 540px; color: var(--ink-2); }
.hero-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 40px; }

.portrait { justify-self: end; width: 100%; max-width: 400px; margin-top: 52px; }
.portrait-img {
  position: relative; overflow: hidden; border-radius: 4px; aspect-ratio: 2 / 3; background: var(--surface-2);
}
.portrait-img img {
  width: 100%; height: 100%; object-fit: cover; object-position: 47% 50%;
  filter: grayscale(1) sepia(0.12) contrast(1.05);
}
.portrait-img::after {
  content: ''; position: absolute; inset: 0; opacity: 0.05; mix-blend-mode: multiply;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
.hero-meta {
  display: grid; grid-template-columns: repeat(2, auto); justify-content: start; gap: 4px 48px;
  margin: 56px 0 0; padding-top: 20px; border-top: 1px solid var(--line); max-width: 540px; font-size: 14px;
}
.hero-meta dt { font: 400 12px/1.6 var(--mono); color: var(--muted-2); grid-row: 1; }
.hero-meta dd { margin: 0; color: var(--ink-2); grid-row: 2; }

/* ── Metrics bento ─────────────────────────────── */
.metrics { display: grid; grid-template-columns: repeat(12, 1fr); gap: 16px; margin-top: 88px; }
.metric { padding: 32px; display: flex; flex-direction: column; min-height: 280px; }
.metric:nth-child(1) { grid-column: span 6; }
.metric:nth-child(2), .metric:nth-child(3) { grid-column: span 3; }
.metric:nth-child(1) .metric-label { font-size: 18px; }
.metric-value {
  white-space: nowrap;
  font: 400 64px/1 var(--serif); letter-spacing: -0.04em; color: var(--ink);
  font-variant-numeric: tabular-nums;
}
.metric:nth-child(1) .metric-value { font-size: 112px; }
.metric-suffix { color: var(--muted-2); }
.metric-label { margin-top: auto; padding-top: 28px; font-weight: 500; color: var(--ink); line-height: 1.4; }
.metric-note { margin-top: 8px; font-size: 14px; color: var(--muted); }

/* ── Cases ─────────────────────────────────────── */
.cases { display: grid; grid-template-columns: repeat(12, 1fr); gap: 16px; }
.case { padding: 40px; grid-column: span 6; display: flex; flex-direction: column; }
.case.is-feature { grid-column: span 12; display: grid; grid-template-columns: 1.1fr 1fr; gap: 56px; }
.case-top { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.case-client {
  font: 400 32px/1.15 var(--serif); letter-spacing: -0.025em; color: var(--ink);
  margin: 24px 0 12px;
}
.case.is-feature .case-client { font-size: 40px; }
.case-role { font: 400 13px/1.5 var(--mono); color: var(--muted); }
.case-summary { margin-top: 20px; color: var(--ink-2); }
.case-results {
  display: grid; grid-template-columns: 1fr 1fr;
  border: 1px solid var(--line); border-radius: 8px; overflow: hidden;
  margin-top: 32px; background: var(--surface-2);
}
.case.is-feature .case-results { margin-top: 0; align-self: start; }
.stat { padding: 20px 22px; }
.stat:nth-child(odd) { border-right: 1px solid var(--line); }
.stat:nth-child(n+3) { border-top: 1px solid var(--line); }
.stat-num { font: 400 36px/1 var(--serif); letter-spacing: -0.03em; color: var(--ink); font-variant-numeric: tabular-nums; }
.stat-suf { font-size: 22px; color: var(--muted-2); margin-left: 2px; }
.stat-label { margin-top: 10px; font-size: 13px; line-height: 1.45; color: var(--muted); }

.case-more { margin-top: 28px; border-top: 1px solid var(--line); }
.acc-btn {
  width: 100%; display: flex; align-items: center; justify-content: space-between;
  padding: 16px 0; font-size: 14px; font-weight: 500; color: var(--ink); text-align: left;
}
.acc-icon { position: relative; width: 12px; height: 12px; flex-shrink: 0; }
.acc-icon::before, .acc-icon::after {
  content: ''; position: absolute; left: 0; top: 5px; width: 12px; height: 2px; background: var(--ink);
  transition: transform 300ms var(--ease);
}
.acc-icon::after { transform: rotate(90deg); }
.is-open .acc-icon::after { transform: rotate(0deg); }
.acc-panel { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 400ms var(--ease); }
.is-open .acc-panel { grid-template-rows: 1fr; }
.acc-inner { overflow: hidden; }
.acc-body { padding: 4px 0 20px; display: grid; gap: 20px; font-size: 15px; }
.acc-k { font: 400 12px/1 var(--mono); color: var(--muted-2); margin-bottom: 8px; }
.acc-body ol { counter-reset: step; display: grid; gap: 8px; }
.acc-body ol li { counter-increment: step; display: grid; grid-template-columns: 28px 1fr; }
.acc-body ol li::before { content: counter(step, decimal-leading-zero); font: 400 12px/1.9 var(--mono); color: var(--muted-2); }

.case-link {
  display: inline-flex; align-items: center; gap: 8px; margin-top: auto; padding-top: 8px;
  font-size: 14px; font-weight: 500; color: var(--ink);
}
.case-link svg { width: 12px; height: 12px; transition: transform 200ms var(--ease); }
.case-link:hover svg { transform: translate(2px, -2px); }
.case-link span { border-bottom: 1px solid var(--line); transition: border-color 200ms ease; }
.case-link:hover span { border-color: var(--ink); }

/* ── Experience ────────────────────────────────── */
.exp { border-top: 1px solid var(--line); }
.exp-row {
  display: grid; grid-template-columns: 200px 1fr 1.25fr; gap: 32px;
  padding: 28px 0; border-bottom: 1px solid var(--line);
}
.exp-period { font: 400 13px/1.6 var(--mono); color: var(--ink-2); }
.exp-loc { font-size: 13px; color: var(--muted-2); margin-top: 2px; }
.exp-org { font: 400 22px/1.25 var(--serif); letter-spacing: -0.015em; color: var(--ink); }
.exp-role { font-size: 14px; color: var(--muted); margin-top: 4px; }
.exp-impact { display: grid; gap: 8px; font-size: 15px; }
.exp-impact li { position: relative; padding-left: 18px; }
.exp-impact li::before { content: ''; position: absolute; left: 0; top: 11px; width: 8px; height: 1px; background: var(--muted-2); }

/* ── Recommendations ───────────────────────────── */
.recos { display: grid; grid-template-columns: repeat(12, 1fr); gap: 16px; }
.reco { padding: 32px; display: flex; flex-direction: column; gap: 28px; }
.reco:nth-child(1) { grid-column: span 7; }
.reco:nth-child(2) { grid-column: span 5; }
.reco:nth-child(3) { grid-column: span 5; }
.reco:nth-child(4) { grid-column: span 7; }
.reco:nth-child(5), .reco:nth-child(6) { grid-column: span 6; }
.reco blockquote { font: 400 18px/1.55 var(--serif); color: var(--ink); letter-spacing: -0.005em; }
.reco:nth-child(1) blockquote, .reco:nth-child(4) blockquote { font-size: 21px; line-height: 1.5; }
.reco figcaption { display: flex; align-items: center; gap: 12px; margin-top: auto; }
.avatar {
  width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
  display: grid; place-items: center; font: 500 13px/1 var(--sans);
}
.reco-name { font-size: 14px; font-weight: 500; color: var(--ink); }
.reco-role { font-size: 13px; color: var(--muted); }

/* ── Contact ───────────────────────────────────── */
.contact { padding: 56px; display: grid; grid-template-columns: 1.2fr 1fr; gap: 56px; align-items: end; }
.contact-title { font: 400 clamp(44px, 6vw, 72px)/1.02 var(--serif); letter-spacing: -0.035em; color: var(--ink); margin-top: 20px; }
.contact-sub { margin-top: 20px; max-width: 480px; color: var(--muted); font-size: 17px; }
.contact-side { display: grid; gap: 0; }
.contact-row {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 16px 0; border-bottom: 1px solid var(--line);
}
.contact-row:first-child { border-top: 1px solid var(--line); }
.contact-row .k { font: 400 12px/1 var(--mono); color: var(--muted-2); }
.contact-row .v { font-size: 15px; color: var(--ink); display: inline-flex; align-items: center; gap: 8px; }
.contact-row .v svg { width: 12px; height: 12px; transition: transform 200ms var(--ease); }
a.contact-row:hover .v svg { transform: translate(2px, -2px); }
.contact-cta { margin-top: 24px; }

.foot { padding: 40px 0 56px; }
.foot-in { display: flex; justify-content: space-between; gap: 16px; font: 400 12px/1.6 var(--mono); color: var(--muted-2); }

/* ── Reveal ────────────────────────────────────── */
.reveal { opacity: 0; transform: translateY(12px); transition: opacity 600ms var(--ease), transform 600ms var(--ease); transition-delay: calc(var(--i, 0) * 80ms); }
.reveal.is-in { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .reveal { opacity: 1; transform: none; transition: none; }
  .ambient::before, .tag-green .tag-dot { animation: none; }
}

/* ── Responsive ────────────────────────────────── */
@media (max-width: 960px) {
  .nav-links { display: none; }
  .hero-grid { grid-template-columns: 1fr; row-gap: 48px; }
  .portrait { justify-self: start; max-width: 360px; margin-top: 0; }
  .hero-meta { grid-template-columns: 1fr; }
  .hero-meta dt, .hero-meta dd { grid-row: auto; }
  .hero-meta dd + dt { margin-top: 8px; }
  .sh { grid-template-columns: 1fr; gap: 16px; }
  .metric:nth-child(1) { grid-column: span 12; }
  .metric:nth-child(2), .metric:nth-child(3) { grid-column: span 6; }
  .case, .case.is-feature { grid-column: span 12; }
  .case.is-feature { grid-template-columns: 1fr; gap: 32px; }
  .reco:nth-child(n) { grid-column: span 12; }
  .exp-row { grid-template-columns: 1fr; gap: 12px; }
  .contact { grid-template-columns: 1fr; padding: 40px; }
}
@media (max-width: 600px) {
  :root { --gutter: 16px; }
  .section { padding: 88px 0; }
  .hero { padding: 56px 0 72px; }
  .brand-role { display: none; }
  .lang-opt span { display: none; }
  .nav-r { gap: 8px; }
  .metrics { margin-top: 56px; }
  .metric:nth-child(n) { grid-column: span 12; min-height: 0; }
  .metric:nth-child(1) .metric-value { font-size: 80px; }
  .case, .contact, .reco, .metric { padding: 24px; }
  .case-client, .case.is-feature .case-client { font-size: 30px; }
  .case-top { flex-wrap: wrap; }
  .stat { padding: 16px; }
  .stat-num { font-size: 30px; }
  .foot-in { flex-direction: column; }
}
</style>
</head>

      readCase: 'Read the full case study', caseSuffix: '-en',
      contactTitle: 'Let’s work together.', availability: 'Availability', writeLinkedIn: 'Message me on LinkedIn',
      updated: 'Updated', q: ['“', '”'],
    },
  };

  const NAV_IDS = ['cases', 'parcours', 'recos', 'contact'];
  const CASE_TONES = { sg: 'blue', ecv: 'yellow', fdj: 'red' };
  const AVATAR_TONES = ['blue', 'green', 'yellow', 'red', 'green', 'blue'];

  // Language: ?lang= in the URL, then the saved choice, then the browser language.
  const store = {
    get() { try { return localStorage.getItem('lang'); } catch (e) { return null; } },
    set(v) { try { localStorage.setItem('lang', v); } catch (e) {} },
  };
  const pick = (v) => (v === 'fr' || v === 'en' ? v : null);
  let lang = pick(new URLSearchParams(location.search).get('lang'))
    || pick(store.get())
    || (/^fr\b/i.test(navigator.language || 'fr') ? 'fr' : 'en');

  const langToggle = (t) => `
    <div class="lang" role="group" aria-label="${t.langLabel}">
      ${['fr', 'en'].map((l) => `<button type="button" class="lang-opt" data-lang="${l}" aria-pressed="${l === lang}" aria-label="${l === 'fr' ? 'Français' : 'English'}">${FLAGS[l]}<span>${l.toUpperCase()}</span></button>`).join('')}
    </div>`;

  const sectionHead = (kicker, title, sub) => `
    <header class="sh reveal">
      <div class="eyebrow">${esc(kicker)}</div>
      <div>
        <h2 class="sh-title">${title.split('\n').map((l) => `<span>${esc(l)}</span>`).join('')}</h2>
        ${sub ? `<p class="sh-sub">${esc(sub)}</p>` : ''}
      </div>
    </header>`;

  const stat = (r) => {
    const n = parseInt(r.k, 10);
    const numeric = /^\d+$/.test(r.k.trim());
    return `
      <div class="stat">
        <div class="stat-num">${numeric ? `<span data-count="${n}">0</span>` : esc(r.k)}<span class="stat-suf">${esc(r.s)}</span></div>
        <div class="stat-label">${esc(r.v)}</div>
      </div>`;
  };

  const caseCard = (t) => (c, i) => {
    const head = `
      <div>
        <div class="case-top">
          <span class="tag tag-${CASE_TONES[c.id] || 'blue'}">${esc(t.caseLabels[c.id] || c.id)}</span>
          <span class="eyebrow">${esc(c.period)}</span>
        </div>
        <h3 class="case-client">${esc(c.client)}</h3>
        <div class="case-role">${esc(c.role)}</div>
        <p class="case-summary">${esc(c.summary)}</p>
      </div>`;
    const more = `
      <div class="case-more">
        <button class="acc-btn" aria-expanded="false">${t.more}<span class="acc-icon" aria-hidden="true"></span></button>
        <div class="acc-panel"><div class="acc-inner"><div class="acc-body">
          <div><div class="acc-k">${t.context}</div><p>${esc(c.context)}</p></div>
          <div><div class="acc-k">${t.problem}</div><p>${esc(c.problem)}</p></div>
          <div><div class="acc-k">${t.actions}</div><ol>${c.action.map((a) => `<li>${esc(a)}</li>`).join('')}</ol></div>
        </div></div></div>
      </div>`;
    const href = c.detailUrl ? c.detailUrl.replace(/\.html$/, t.caseSuffix + '.html') : '';
    const link = href ? `<a class="case-link" href="${esc(href)}"><span>${t.readCase}</span>${arrow}</a>` : '';
    const results = `<div class="case-results">${c.result.map(stat).join('')}</div>`;

    if (i === 0) {
      return `
        <article class="card case is-feature reveal" style="--i:${i}">
          <div style="display:flex;flex-direction:column">${head}${more}${link}</div>
          ${results}
        </article>`;
    }
    return `
      <article class="card case reveal" style="--i:${i}">
        ${head}${results}${more}${link}
      </article>`;
  };

  const initials = (name) => name.replace('.', '').split(' ').map((p) => p[0]).join('');

  const page = (C, t) => {
    const heroTitle = C.home.title.split('\n')
      .map((l) => '<span>' + esc(l).replace(t.emph, `<em>${t.emph}</em>`) + '</span>')
      .join('');
    return `
    <nav class="nav">
      <div class="wrap nav-in">
        <a class="brand" href="#top">
          <span class="brand-name">Martin Molet</span>
          <span class="brand-role">Design System & Design Ops</span>
        </a>
        <div class="nav-links">
          ${NAV_IDS.map((id) => `<a href="#${id}" data-nav="${id}">${esc(t.nav[id])}</a>`).join('')}
        </div>
        <div class="nav-r">
          ${langToggle(t)}
          <a class="btn btn-primary btn-sm" href="#contact">${esc(C.home.cta2)}</a>
        </div>
      </div>
    </nav>

    <main>
      <section class="hero" id="top">
        <div class="wrap">
          <div class="hero-grid">
            <div>
              <span class="tag tag-green reveal"><span class="tag-dot"></span>${esc(C.meta.status)}</span>
              <h1 class="hero-title reveal" style="--i:1">${heroTitle}</h1>
              <p class="hero-sub reveal" style="--i:2">${esc(C.home.sub)}</p>
              <div class="hero-cta reveal" style="--i:3">
                <a class="btn btn-primary" href="#cases">${esc(C.home.cta1)}${arrow}</a>
                <a class="btn btn-ghost" href="#contact">${esc(C.home.cta2)}</a>
              </div>
              <dl class="hero-meta reveal" style="--i:4">
                <dt>${t.role}</dt><dd>${esc(C.meta.role)}</dd>
                <dt>${t.location}</dt><dd>${esc(C.meta.location)}</dd>
              </dl>
            </div>
            <figure class="portrait reveal" style="--i:2">
              <div class="portrait-img"><img src="ppchill.jpg" alt="${t.portraitAlt}" width="960" height="960"></div>
            </figure>
          </div>

          <div class="metrics" id="metrics">
            ${C.home.metrics.map((m, i) => `
              <article class="card metric reveal" style="--i:${i}">
                <div class="metric-value"><span data-count="${m.value}">0</span><span class="metric-suffix">${esc(m.suffix)}</span></div>
                <div class="metric-label">${esc(m.label)}</div>
                <p class="metric-note">${esc(m.note)}</p>
              </article>`).join('')}
          </div>
        </div>
      </section>

      <section class="section" id="cases">
        <div class="wrap">
          ${sectionHead(t.k.cases, C.cases.title)}
          <div class="cases">${C.cases.items.map(caseCard(t)).join('')}</div>
        </div>
      </section>

      <section class="section" id="parcours">
        <div class="wrap">
          ${sectionHead(t.k.parcours, C.experience.title)}
          <ol class="exp">
            ${C.experience.items.map((e, i) => `
              <li class="exp-row reveal" style="--i:${Math.min(i, 3)}">
                <div><div class="exp-period">${esc(e.period)}</div><div class="exp-loc">${esc(e.location)}</div></div>
                <div><div class="exp-org">${esc(e.org)}</div><div class="exp-role">${esc(e.role)}</div></div>
                <ul class="exp-impact">${e.impact.map((im) => `<li>${esc(im)}</li>`).join('')}</ul>
              </li>`).join('')}
          </ol>
        </div>
      </section>

      <section class="section" id="recos">
        <div class="wrap">
          ${sectionHead(t.k.recos, C.recos.title)}
          <div class="recos">
            ${C.recos.items.map((r, i) => `
              <figure class="card reco reveal" style="--i:${i % 2}">
                <blockquote>${t.q[0]}${esc(r.quote)}${t.q[1]}</blockquote>
                <figcaption>
                  <span class="avatar tag-${AVATAR_TONES[i]}" aria-hidden="true">${esc(initials(r.name))}</span>
                  <span><div class="reco-name">${esc(r.name)}</div><div class="reco-role">${esc(r.role)}</div></span>
                </figcaption>
              </figure>`).join('')}
          </div>
        </div>
      </section>

      <section class="section" id="contact">
        <div class="wrap">
          <div class="card contact reveal">
            <div>
              <span class="eyebrow">${t.k.contact}</span>
              <h2 class="contact-title">${t.contactTitle}</h2>
              <p class="contact-sub">${esc(C.contact.sub)}</p>
            </div>
            <div>
              <div class="contact-side">
                ${C.contact.links.map((l) => l.href
                  ? `<a class="contact-row" href="${esc(l.href)}" target="_blank" rel="noopener noreferrer"><span class="k">${esc(l.k)}</span><span class="v">${esc(l.v)}${arrow}</span></a>`
                  : `<div class="contact-row"><span class="k">${esc(l.k)}</span><span class="v">${esc(l.v)}</span></div>`).join('')}
                <div class="contact-row"><span class="k">${t.availability}</span><span class="tag tag-green"><span class="tag-dot"></span>${esc(C.contact.availability.split(/[—-]\s*/).pop())}</span></div>
              </div>
              <a class="btn btn-primary contact-cta" href="${esc(C.contact.links[0].href)}" target="_blank" rel="noopener noreferrer">${t.writeLinkedIn}${arrow}</a>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="foot">
      <div class="wrap foot-in">
        <span>Martin Molet · ${esc(C.meta.role)}</span>
        <span>${t.updated} ${esc(C.meta.lastUpdated)}</span>
      </div>
    </footer>`;
  };

  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const countUp = (el) => {
    const target = Number(el.dataset.count);
    if (reduce) { el.textContent = target; return; }
    const dur = 1200;
    let t0;
    const tick = (t) => {
      t0 = t0 || t;
      const p = Math.min(1, (t - t0) / dur);
      el.textContent = Math.round(target * (1 - Math.pow(1 - p, 3)));
      if (p < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  };

  let observers = [];

  const render = (animate) => {
    const C = window.CONTENT[lang];
    const t = UI[lang];
    observers.forEach((o) => o.disconnect());
    observers = [];

    document.documentElement.lang = lang;
    document.title = t.docTitle;
    document.getElementById('app').innerHTML = page(C, t);

    // Language toggle
    document.querySelectorAll('.lang-opt').forEach((b) => b.addEventListener('click', () => {
      if (b.dataset.lang === lang) return;
      lang = b.dataset.lang;
      store.set(lang);
      const url = new URL(location.href);
      url.searchParams.delete('lang');
      history.replaceState(null, '', url);
      render(false);
    }));

    // Accordions
    document.querySelectorAll('.case-more').forEach((el) => {
      const btn = el.querySelector('.acc-btn');
      btn.addEventListener('click', () => {
        const open = el.classList.toggle('is-open');
        btn.setAttribute('aria-expanded', String(open));
      });
    });

    // Scroll reveal. On a language switch, show everything at once.
    if (animate) {
      const io = new IntersectionObserver((entries) => {
        entries.forEach((e) => {
          if (!e.isIntersecting) return;
          e.target.classList.add('is-in');
          e.target.querySelectorAll('[data-count]').forEach(countUp);
          io.unobserve(e.target);
        });
      }, { threshold: 0.15, rootMargin: '0px 0px -40px 0px' });
      document.querySelectorAll('.reveal').forEach((el) => io.observe(el));
      observers.push(io);
    } else {
      document.querySelectorAll('.reveal').forEach((el) => el.classList.add('is-in'));
      document.querySelectorAll('[data-count]').forEach((el) => { el.textContent = el.dataset.count; });
    }

    // Active nav + nav border
    const nav = document.querySelector('.nav');
    const links = document.querySelectorAll('[data-nav]');
    const spy = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (e.isIntersecting) links.forEach((a) => a.classList.toggle('is-active', a.dataset.nav === e.target.id));
      });
    }, { rootMargin: '-45% 0px -50% 0px' });
    NAV_IDS.forEach((id) => spy.observe(document.getElementById(id)));
    const border = new IntersectionObserver(([e]) => nav.classList.toggle('is-scrolled', !e.isIntersecting));
    border.observe(document.querySelector('.hero-title'));
    observers.push(spy, border);
  };

  render(true);
})();
</script>
</body>
</html>
